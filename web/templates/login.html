{{define "content"}}
<div class="min-h-screen grid lg:grid-cols-[1.05fr_1fr]">
  <aside class="relative hidden overflow-hidden bg-navy lg:flex lg:flex-col lg:justify-between lg:rounded-r-[64px] p-14">
    <div class="absolute inset-0" style="background:
        radial-gradient(90% 80% at 20% 10%, rgba(84,116,168,.42) 0%, rgba(13,19,48,0) 58%),
        radial-gradient(80% 70% at 90% 90%, rgba(196,142,88,.26) 0%, rgba(13,19,48,0) 62%),
        linear-gradient(155deg,#16203f 0%,#0d1330 52%,#080b1a 100%);"></div>
    <div class="relative">
      <a href="/" class="flex items-center gap-2.5">
        <span class="h-[7px] w-[7px] rounded-full bg-paper/85"></span>
        <span class="font-display text-[21px] tracking-[0.14em] text-paper">PHOTOLIVE</span>
      </a>
    </div>
    <div class="relative">
      <p class="text-[11px] tracking-[0.3em] text-paper/45">PHOTO DELIVERY</p>
      <h2 class="font-display mt-5 text-[clamp(40px,4.4vw,62px)] leading-[1.16] text-paper">
        拍摄结束前，<br>挑片已经完成。
      </h2>
      <p class="mt-7 max-w-[400px] text-[14px] font-light leading-[1.9] text-paper/60">
        摄影师建房间、现场上传；客户扫码即看、点选喜欢。你只需要在结束时导出那份文件名清单。
      </p>
    </div>
    <div class="relative flex items-center gap-6 text-[11px] tracking-[0.1em] text-paper/35">
      <span>现场交付</span>
      <span class="h-3 w-px bg-paper/15"></span>
      <span>客户免注册</span>
      <span class="h-3 w-px bg-paper/15"></span>
      <span>内测免费</span>
    </div>
  </aside>

  <main class="flex flex-col justify-center px-6 py-14 sm:px-12 lg:px-20">
    <div class="mx-auto w-full max-w-[400px]">
      <a href="/" class="mb-12 flex items-center gap-2.5 lg:hidden">
        <span class="h-[7px] w-[7px] rounded-full bg-paper/85"></span>
        <span class="font-display text-[19px] tracking-[0.14em] text-paper">PHOTOLIVE</span>
      </a>

      <h1 class="font-display text-[38px] leading-tight text-paper" id="formTitle">欢迎回来</h1>
      <p class="mt-2 text-[13.5px] font-light text-paper/50" id="formHint">登录后继续管理你的活动房间。</p>

      <div class="mt-8 inline-flex rounded-full border border-paper/12 p-1">
        <button id="tabLogin" class="rounded-full bg-paper px-5 py-2 text-[12.5px] font-medium text-ink">登录</button>
        <button id="tabRegister" class="rounded-full px-5 py-2 text-[12.5px] text-paper/60">注册</button>
      </div>

      <form id="authForm" class="mt-7 space-y-3">
        <div>
          <label class="mb-1.5 block text-[11.5px] tracking-[0.08em] text-paper/45">邮箱</label>
          <input id="email" type="email" class="field" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div>
          <label class="mb-1.5 block text-[11.5px] tracking-[0.08em] text-paper/45">密码</label>
          <input id="password" type="password" class="field" placeholder="至少 8 位，含字母与数字" autocomplete="current-password" required>
        </div>
        <p id="error" class="hidden rounded-xl border border-red-400/25 bg-red-400/10 px-3 py-2.5 text-[12.5px] text-red-200/90"></p>
        <button id="submitBtn" type="submit" class="btn-primary mt-2 w-full !py-3.5">登录</button>
      </form>

      <p class="mt-6 text-[11.5px] leading-relaxed text-paper/30">
        内测阶段暂不提供密码找回。忘记密码请联系部署方管理员重置。
      </p>
    </div>
  </main>
</div>
{{end}}

{{define "scripts"}}
<script>
(function () {
  var mode = 'login';
  var tabLogin = document.getElementById('tabLogin');
  var tabRegister = document.getElementById('tabRegister');
  var title = document.getElementById('formTitle');
  var hint = document.getElementById('formHint');
  var form = document.getElementById('authForm');
  var submit = document.getElementById('submitBtn');
  var error = document.getElementById('error');
  var pwd = document.getElementById('password');
  var lockTimer = null;

  function startLock(seconds) {
    clearInterval(lockTimer);
    var left = seconds > 0 ? seconds : 0;
    function tick() {
      if (left <= 0) {
        clearInterval(lockTimer);
        submit.disabled = false;
        submit.textContent = mode === 'login' ? '登录' : '注册并进入';
        error.textContent = '可以重新尝试登录了';
        return;
      }
      var m = Math.floor(left / 60);
      var s = left % 60;
      error.textContent = '尝试次数过多，请在 ' + m + ':' + String(s).padStart(2, '0') + ' 后重试';
      error.classList.remove('hidden');
      left--;
    }
    tick();
    lockTimer = setInterval(tick, 1000);
  }

  function setMode(next) {
    mode = next;
    var active = 'rounded-full bg-paper px-5 py-2 text-[12.5px] font-medium text-ink';
    var idle = 'rounded-full px-5 py-2 text-[12.5px] text-paper/60';
    tabLogin.className = mode === 'login' ? active : idle;
    tabRegister.className = mode === 'register' ? active : idle;
    title.textContent = mode === 'login' ? '欢迎回来' : '创建摄影师账号';
    hint.textContent = mode === 'login' ? '登录后继续管理你的活动房间。' : '注册后即可创建活动房间，客户无需账号。';
    submit.textContent = mode === 'login' ? '登录' : '注册并进入';
    pwd.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    error.classList.add('hidden');
  }

  tabLogin.addEventListener('click', function () { setMode('login'); });
  tabRegister.addEventListener('click', function () { setMode('register'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    error.classList.add('hidden');
    submit.disabled = true;
    var original = submit.textContent;
    submit.textContent = '处理中…';
    fetch('/api/auth/' + mode, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: pwd.value
      })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          if (res.status === 423 && data.seconds) {
            startLock(data.seconds);
            return;
          }
          throw new Error(data.error || '操作失败，请重试');
        }
        window.location.href = '/admin';
      });
    }).catch(function (err) {
      error.textContent = err.message;
      error.classList.remove('hidden');
      submit.disabled = false;
      submit.textContent = original;
    });
  });
})();
</script>
{{end}}
